[package]
name = "clonehunter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Find duplicate code across mixed-language repositories"
license = "MIT"
default-run = "clonehunter"

[[bin]]
name = "clonehunter"
path = "src/main.rs"

[lib]
name = "clonehunter"
path = "src/lib.rs"

[dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Embedding (candle) — CodeBERT is RoBERTa-family
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = "0.3"

# Database (embedding cache)
rusqlite = { version = "0.32", features = ["bundled"] }

# Parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"

# Numeric
ndarray = "0.16"

# Parallelism
rayon = "1"

# Diff
similar = "2"

# Regex (lexical similarity tokenization)
regex = "1"

# File system
walkdir = "2"
globset = "0.4"
dirs = "5"

# Progress
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[features]
default = []
# CPU BLAS backends (pick per platform): Apple Accelerate on macOS, Intel MKL on x86_64.
# Closes most of candle's naive-gemm CPU slowdown for transformer inference.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
# GPU backends (opt-in; numerics not part of the frozen CPU baseline).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
