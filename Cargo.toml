[package]
name = "clonehunter"
version = "1.0.0"
edition = "2024"
rust-version = "1.85.0"
description = "Find duplicate code across mixed-language repositories"
license = "MIT"
default-run = "clonehunter"
authors = ["drogers0"]
homepage = "https://github.com/drogers0/clonehunter"
repository = "https://github.com/drogers0/clonehunter"
documentation = "https://github.com/drogers0/clonehunter"
keywords = ["code-clone", "duplicate-code", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "clonehunter"
path = "src/main.rs"

[lib]
name = "clonehunter"
path = "src/lib.rs"

[dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Embedding (candle) — CodeBERT is RoBERTa-family
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = "0.3"

# Database (embedding cache)
rusqlite = { version = "0.32", features = ["bundled"] }

# Parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"

# Numeric
ndarray = "0.16"

# Parallelism
rayon = "1"

# Diff
similar = "2"

# Regex (lexical similarity tokenization)
regex = "1"

# File system
walkdir = "2"
globset = "0.4"
dirs = "5"

# Progress
indicatif = "0.17"

# ONNX Runtime (optional — feature "onnx")
# download-binaries: downloads prebuilt libonnxruntime on first cargo build (no manual install)
# copy-dylibs: copies the dylib next to the binary for easy distribution
# ndarray: disabled — we use (shape, &[T]) tuples to pass tensors without ndarray version conflict
ort = { version = "=2.0.0-rc.9", optional = true, default-features = false, features = ["download-binaries", "copy-dylibs"] }

# Apple MLX backend (optional — feature "mlx")
# Setup: ./scripts/setup-mlx.sh
# Build: MLX_SYS_PREBUILT=~/.local/share/clonehunter/mlx cargo build --release --features mlx
# Version pairing: this Rust crate (0.25.3) versions independently of the Python
# `mlx` package. scripts/setup-mlx.sh installs the mlx==0.25.2 wheel (there is no
# Python mlx 0.25.3); 0.25.3 bindings + 0.25.2 C++ lib is the validated pairing
# (578 findings, 4.47e-13). Re-validate parity before bumping either.
mlx-rs = { version = "=0.25.3", optional = true, default-features = false, features = ["safetensors"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "redactions"] }

[features]
default = []
# CPU BLAS backends (pick per platform): Apple Accelerate on macOS, Intel MKL on x86_64.
# Closes most of candle's naive-gemm CPU slowdown for transformer inference.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
# GPU backends (opt-in; numerics not part of the frozen CPU baseline).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# ONNX Runtime backend (prototype / experimental).
# Enables EmbedderName::Onnx which routes through ort (ONNX Runtime 1.24).
# Requires a pre-exported model.onnx (+ model.onnx.data) at
#   CLONEHUNTER_ONNX_MODEL env var OR ~/.cache/clonehunter/onnx/codebert-base/model.onnx
# Build: cargo build --release --features onnx
# CoreML EP (macOS): cargo build --release --features onnx-coreml
onnx = ["dep:ort"]
onnx-coreml = ["onnx", "ort/coreml"]
# Apple MLX backend. Apple Silicon + prebuilt MLX required.
# Setup: ./scripts/setup-mlx.sh
# Build: MLX_SYS_PREBUILT=~/.local/share/clonehunter/mlx cargo build --release --features mlx
mlx = ["dep:mlx-rs"]

[patch.crates-io]
# Patched to remove "metal" from default features. Metal support is baked into the
# prebuilt libmlx.dylib (installed by scripts/setup-mlx.sh) — no cmake Metal flag needed.
mlx-sys = { path = "vendor/mlx-sys-0.2.0" }

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
