[package]
name = "clonehunter-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = "0.3"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
similar = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
